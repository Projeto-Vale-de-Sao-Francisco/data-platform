name: Pipeline de dados (Databricks)

# O pipeline medalhão é agendado NO DATABRICKS (job campo_vivo_pipeline_medalhao, 05:37 BRT), que é confiável.
# Este workflow faz a ponte com o que o Databricks Free Edition não alcança:
#   agendado (a cada 3 h): leituras reais → landing  +  previsões mais recentes → Postgres (analytics)
#     → se o GitHub pular uma execução agendada, a próxima recupera.
#   push no main (src/ ou seeds/): publica o código no Volume do Databricks.
#   agendado das 06:17 UTC (03:17 BRT): também baixa ComexStat + PTAX (mercado) antes do job das 05:37.
#   manual: entrada | mercado | saida | pipeline (roda o job agora e publica).
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths: ["src/**", "seeds/**", "scripts/publicar_codigo.sh"]
  workflow_dispatch:
    inputs:
      etapa:
        description: "entrada | mercado | saida | pipeline"
        required: true
        default: saida

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
  DATABRICKS_JOB_ID: ${{ vars.DATABRICKS_JOB_ID }}

jobs:
  publicar-codigo:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Publicar código no Volume do Databricks
        run: bash scripts/publicar_codigo.sh

  ponte:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Leituras reais → landing
        if: github.event_name == 'schedule' || inputs.etapa == 'entrada'
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          DEVICE_API_KEY: ${{ secrets.DEVICE_API_KEY }}
          THINGSPEAK_CHANNEL_ID: ${{ vars.THINGSPEAK_CHANNEL_ID }}
          THINGSPEAK_READ_API_KEY: ${{ secrets.THINGSPEAK_READ_API_KEY }}
          THINGSPEAK_DEVICE: ${{ vars.THINGSPEAK_DEVICE }}
        run: python extrator/extrator.py entrada
      - name: Mercado (ComexStat + PTAX) → landing
        if: github.event_name == 'schedule' || inputs.etapa == 'mercado'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "06" ]; then
            echo "Mercado só roda uma vez por dia (06 UTC)."; exit 0
          fi
          python extrator/extrator.py mercado
      - name: Publicar código e rodar o pipeline agora
        if: inputs.etapa == 'pipeline'
        run: |
          bash scripts/publicar_codigo.sh
          python extrator/extrator.py pipeline
      - name: Previsões mais recentes → Postgres
        if: github.event_name == 'schedule' || inputs.etapa == 'saida' || inputs.etapa == 'pipeline'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install "psycopg[binary]"
          python extrator/extrator.py saida
