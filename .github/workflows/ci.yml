name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Sintaxe de todos os scripts
        run: python -m compileall -q src extrator
      - name: Testes do extrator
        run: |
          pip install pytest
          pytest -q tests
      - name: Job do Databricks é JSON válido
        run: python -c "import json; json.load(open('jobs/campo_vivo_pipeline_medalhao.json'))"
